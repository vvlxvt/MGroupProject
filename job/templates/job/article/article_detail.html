{% extends "job/base.html" %}
{% load static %}
{% block meta_description %}{{ meta_description }}{% endblock %}
{% block articles %}
    <div class="container py-3 mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-4 bg-light">
                <ul class="list-unstyled">
                    {% for article in articles %}
                        <li class="list-group-item mb-0 {% if article == object %}active{% endif %}">
                            <a href="{{ article.get_absolute_url }}">{{ article.title }}</a>
                        </li>
                    {% endfor %}
                </ul>
            </div>
            <div class="col-lg-8">
                <div class="card">
                    <img src="{{ article.photo.url }}"
                         class="card-img-top img-fluid"
                         alt="картинка к статье"
                         loading="lazy"
                         width="{{ article.photo.width }}"
                         height="{{ article.photo.height }}">
                    <div class="card-body">
                        <p class="card-text px-3">{{ article.body|safe }}.</p>
                        <div class="card-footer mb-3">
                            <small class="text-muted">Опубликовано: {{ article.publish }}</small>
                        </div>
                        <a href="{{ request.META.HTTP_REFERER|default:'#' }}"
                           class="btn button transparent"
                           onclick="window.history.back(); return false;">назад</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
