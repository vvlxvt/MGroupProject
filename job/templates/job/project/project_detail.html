{% extends "job/base.html" %}
{% load static %}
{% block title %}<title>{{ page_title }}</title>{% endblock %}
{% block projects %}
    <div class="row content-row--centered content-row--aligned">
        <div class="col-12 col-md-6">
            <div class="container project-detail" id="project">
                <article>
                    <h2 class="project-detail__title">{{ project.body }}</h2>
                </article>
                <div class="project-gallery">
                    {% for photo in project.photos.all %}
                        <div class="project-gallery__item">
                            <img class="project-gallery__image clickable-image"
                                 src="{{ photo.image.url }}"
                                 alt="{{ photo.alt|default:'Фотография проекта' }}"
                                 width="{{ photo.image.width }}"
                                 height="{{ photo.image.height }}"
                                 loading="eager"
                                 decoding="async"
                                 data-bs-toggle="modal"
                                 data-bs-target="#imageModal{{ forloop.counter }}">
                        </div>
                        <!-- Modal -->
                        <div class="modal fade"
                             id="imageModal{{ forloop.counter }}"
                             tabindex="-1"
                             aria-label="Просмотр фотографии проекта"
                             aria-hidden="true">
                            <div class="modal-dialog modal-dialog-centered modal-fullscreen">
                                <div class="modal-content">
                                    <div class="modal-body project-modal__body">
                                        <button type="button"
                                                class="project-modal__image-button"
                                                data-bs-dismiss="modal"
                                                aria-label="Закрыть просмотр фотографии">
                                            <img src="{{ photo.image.url }}"
                                                 class="hd_image"
                                                 alt="{{ photo.alt|default:'Фотография проекта' }}">
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
{% endblock %}
