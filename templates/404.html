{% extends "job/base.html" %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block canonical %}{% endblock %}
{% block open_graph %}{% endblock %}
{% block http404 %}
<div class="w-100 d-flex align-items-center justify-content-center">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="error-code text-primary mb-3">404</div>
                        <h1 class="h4 mb-3">Страница не найдена</h1>
                        <p class="text-muted mb-4">
                            Возможно, страница была удалена,<br>
                            переименована или вы ошиблись в адресе.
                        </p>

                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'job:home' %}" class="btn button transparent">
                                На главную
                            </a>
                            <button type="button"
                                    class="btn btn-bd-primary btn--narrow"
                                    onclick="history.back()">
                                Назад
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
